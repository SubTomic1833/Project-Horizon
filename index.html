<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Horizon - Glass Cockpit PFD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-green: #00ff66;
            --neon-magenta: #ff00ff;
            --glass-panel: rgba(15, 23, 42, 0.75);
        }

        body {
            background-color: #05050a;
            color: #f8fafc;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Top Autopilot Mode Control Panel (MCP) */
        header {
            background: #0f172a;
            border-bottom: 2px solid #334155;
            padding: 10px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .brand-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.15em;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .mcp-box {
            background: rgba(0,0,0,0.4);
            border: 1px solid #475569;
            padding: 4px 15px;
            border-radius: 4px;
            text-align: center;
        }
        .mcp-lbl { font-size: 11px; color: #94a3b8; font-weight: bold; }
        .mcp-val { font-family: 'Share Tech Mono', monospace; font-size: 20px; color: var(--neon-cyan); }

        .conn-ui { display: flex; gap: 10px; align-items: center; }
        input {
            background: #1e293b; border: 1px solid #475569; color: white;
            padding: 6px 12px; border-radius: 4px; font-family: monospace; font-size: 13px; outline: none;
        }
        button {
            background: #0284c7; border: none; color: white; padding: 6px 16px;
            border-radius: 4px; font-weight: bold; font-family: 'Rajdhani', sans-serif; cursor: pointer;
        }

        /* Screen Wrapper */
        .pfd-container {
            flex: 1;
            position: relative;
            width: 100vw;
            background: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-title">HORIZON PFD SIM</div>
        
        <div class="mcp-box">
            <div class="mcp-lbl">AP SEL ALT</div>
            <div id="mcpAlt">5000 FT</div>
        </div>

        <div class="conn-ui">
            <input type="text" id="ipAddress" placeholder="10.0.0.79">
            <button onclick="connectToPi()">ENGAGE LINK</button>
        </div>
    </header>

    <div class="pfd-container">
        <canvas id="pfdCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('pfdCanvas');
        const ctx = canvas.getContext('2d');
        const mcpAlt = document.getElementById('mcpAlt');
        
        let socket = null;

        // Shared Flight Telemetry States (with basic internal flight physics engine)
        let sim = {
            pitch: 0, roll: 0, heading: 0,
            altitude: 5000, airspeed: 140,
            targetAlt: 5000
        };

        // Resize Canvas dynamically to fill monitor screen perfectly
        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
            renderPFD();
        }
        window.addEventListener('resize', resizeCanvas);

        function renderPFD() {
            const W = canvas.width;
            const H = canvas.height;
            if (W === 0 || H === 0) return;

            const cx = W / 2;
            const cy = H / 2;

            ctx.clearRect(0, 0, W, H);

            // -------------------------------------------------------------
            // 1. FULL BACKGROUND EXTENDED ATTITUDE HUD
            // -------------------------------------------------------------
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(sim.roll * Math.PI / 180);

            const pitchPxPerDeg = H / 60; 
            const pitchOffset = sim.pitch * pitchPxPerDeg;

            // Sky render
            ctx.fillStyle = "#1d4ed8";
            ctx.fillRect(-W, -H * 2, W * 2, H * 2 + pitchOffset);
            // Ground render
            ctx.fillStyle = "#451a03";
            ctx.fillRect(-W, pitchOffset, W * 2, H * 2);
            // White Horizon line
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(-W, pitchOffset); ctx.lineTo(W, pitchOffset); ctx.stroke();

            // Pitch Ladder Lines
            ctx.strokeStyle = "rgba(255,255,255,0.5)";
            ctx.fillStyle = "rgba(255,255,255,0.9)";
            ctx.lineWidth = 2;
            ctx.font = "700 14px 'Rajdhani', sans-serif";
            ctx.textAlign = "center"; ctx.textBaseline = "middle";

            for (let i = -30; i <= 30; i += 10) {
                if (i === 0) continue;
                let yPos = pitchOffset - (i * pitchPxPerDeg);
                ctx.beginPath();
                ctx.moveTo(-40, yPos); ctx.lineTo(40, yPos);
                ctx.stroke();
                ctx.fillText(Math.abs(i), -60, yPos);
                ctx.fillText(Math.abs(i), 60, yPos);
            }
            ctx.restore();

            // -------------------------------------------------------------
            // 2. STATIC CENTER AIRCRAFT RETICLE (Standard Boeing style)
            // -------------------------------------------------------------
            ctx.strokeStyle = "#ffaa00";
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(cx - 100, cy); ctx.lineTo(cx - 40, cy); ctx.lineTo(cx - 40, cy + 15);
            ctx.moveTo(cx + 100, cy); ctx.lineTo(cx + 40, cy); ctx.lineTo(cx + 40, cy + 15);
            ctx.moveTo(cx - 5, cy); ctx.lineTo(cx + 5, cy);
            ctx.moveTo(cx, cy - 5); ctx.lineTo(cx, cy + 5);
            ctx.stroke();

            // -------------------------------------------------------------
            // 3. AIRSPEED VERTICAL TAPE (LEFT EDGE)
            // -------------------------------------------------------------
            const tapeW = 75;
            const tapeH = H * 0.7;
            const tapeY = (H - tapeH) / 2;

            ctx.fillStyle = "rgba(15, 23, 42, 0.8)";
            ctx.strokeStyle = "#475569";
            ctx.lineWidth = 2;
            ctx.fillRect(20, tapeY, tapeW, tapeH);
            ctx.strokeRect(20, tapeY, tapeW, tapeH);

            ctx.save();
            ctx.beginPath(); ctx.rect(20, tapeY, tapeW, tapeH); ctx.clip();
            ctx.fillStyle = "#ffffff";
            ctx.strokeStyle = "rgba(255,255,255,0.4)";
            ctx.font = "14px 'Share Tech Mono', monospace";
            ctx.textAlign = "right";

            let startSpeed = Math.floor(sim.airspeed - 30);
            let endSpeed = Math.floor(sim.airspeed + 30);
            for (let s = startSpeed; s <= endSpeed; s++) {
                if (s % 5 === 0 && s >= 0) {
                    let sOffset = cy - (s - sim.airspeed) * (tapeH / 60);
                    ctx.beginPath(); ctx.moveTo(70, sOffset); ctx.lineTo(95, sOffset); ctx.stroke();
                    if (s % 10 === 0) ctx.fillText(s, 65, sOffset + 4);
                }
            }
            ctx.restore();
            
            // Current Airspeed Digital Box overlay
            ctx.fillStyle = "#000000"; ctx.fillRect(15, cy - 15, 65, 30);
            ctx.strokeStyle = varColor('--neon-green'); ctx.strokeRect(15, cy - 15, 65, 30);
            ctx.fillStyle = varColor('--neon-green'); ctx.font = "bold 18px 'Share Tech Mono'";
            ctx.textAlign = "center"; ctx.fillText(Math.round(sim.airspeed), 47, cy + 6);

            // -------------------------------------------------------------
            // 4. ALTITUDE VERTICAL TAPE (RIGHT EDGE)
            // -------------------------------------------------------------
            const altX = W - 25 - tapeW;
            ctx.fillStyle = "rgba(15, 23, 42, 0.8)";
            ctx.fillRect(altX, tapeY, tapeW, tapeH);
            ctx.strokeRect(altX, tapeY, tapeW, tapeH);

            ctx.save();
            ctx.beginPath(); ctx.rect(altX, tapeY, tapeW, tapeH); ctx.clip();
            ctx.fillStyle = "#ffffff";
            ctx.strokeStyle = "rgba(255,255,255,0.4)";
            ctx.font = "14px 'Share Tech Mono', monospace";
            ctx.textAlign = "left";

            let startAlt = Math.floor(sim.altitude - 300);
            let endAlt = Math.floor(sim.altitude + 300);
            for (let a = startAlt; a <= endAlt; a++) {
                if (a % 50 === 0) {
                    let aOffset = cy - (a - sim.altitude) * (tapeH / 600);
                    ctx.beginPath(); ctx.moveTo(altX, aOffset); ctx.lineTo(altX + 20, aOffset); ctx.stroke();
                    if (a % 100 === 0) ctx.fillText(a, altX + 25, aOffset + 4);
                }
            }

            // Target Altitude Bug Rendering on the Moving Tape
            let bugY = cy - (sim.targetAlt - sim.altitude) * (tapeH / 600);
            ctx.fillStyle = varColor('--neon-cyan');
            ctx.beginPath();
            ctx.moveTo(altX, bugY); ctx.lineTo(altX + 12, bugY - 8); ctx.lineTo(altX + 35, bugY - 8);
            ctx.lineTo(altX + 35, bugY + 8); ctx.lineTo(altX + 12, bugY + 8);
            ctx.fill();
            ctx.fillStyle = "#000000"; ctx.font = "bold 10px sans-serif";
            ctx.fillText("AL", altX + 5, bugY + 3);

            ctx.restore();

            // Current Altitude Digital Box overlay
            ctx.fillStyle = "#000000"; ctx.fillRect(altX + 15, cy - 15, 75, 30);
            ctx.strokeStyle = varColor('--neon-green'); ctx.strokeRect(altX + 15, cy - 15, 75, 30);
            ctx.fillStyle = varColor('--neon-green'); ctx.font = "bold 18px 'Share Tech Mono'";
            ctx.textAlign = "center"; ctx.fillText(Math.round(sim.altitude), altX + 52, cy + 6);

            // -------------------------------------------------------------
            // 5. HORIZONTAL COMPASS HEADING TAPE (BOTTOM EDGE)
            // -------------------------------------------------------------
            const hdgW = W * 0.4;
            const hdgH = 40;
            const hdgX = cx - (hdgW / 2);
            const hdgY = H - 60;

            ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
            ctx.fillRect(hdgX, hdgY, hdgW, hdgH);
            ctx.strokeRect(hdgX, hdgY, hdgW, hdgH);

            ctx.save();
            ctx.beginPath(); ctx.rect(hdgX, hdgY, hdgW, hdgH); ctx.clip();
            ctx.strokeStyle = "rgba(255,255,255,0.4)";
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 13px 'Share Tech Mono'";
            ctx.textAlign = "center";

            let startHdg = Math.floor(sim.heading - 25);
            let endHdg = Math.floor(sim.heading + 25);
            for (let h = startHdg; h <= endHdg; h++) {
                let normalizedHdg = (h + 360) % 360;
                let hOffset = cx + (h - sim.heading) * (hdgW / 50);
                
                if (normalizedHdg % 5 === 0) {
                    ctx.beginPath(); ctx.moveTo(hOffset, hdgY); ctx.lineTo(hOffset, hdgY + 10); ctx.stroke();
                    
                    if (normalizedHdg % 10 === 0) {
                        let label = normalizedHdg / 10;
                        if (normalizedHdg === 0) label = "N";
                        else if (normalizedHdg === 90) label = "E";
                        else if (normalizedHdg === 180) label = "S";
                        else if (normalizedHdg === 270) label = "W";
                        ctx.fillText(label, hOffset, hdgY + 26);
                    }
                }
            }
            ctx.restore();

            // Center heading index indicator pointer
            ctx.fillStyle = varColor('--neon-magenta');
            ctx.beginPath(); ctx.moveTo(cx, hdgY); ctx.lineTo(cx - 8, hdgY - 10); ctx.lineTo(cx + 8, hdgY - 10); ctx.fill();
        }

        function varColor(name) {
            return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        }

        // Initialize display context
        setTimeout(resizeCanvas, 100);

        // Basic physics loop to turn sensor data into continuous altitude/airspeed variations
        setInterval(() => {
            // Internal aerodynamics engine link
            // Climbing decays speed, diving triggers acceleration
            sim.altitude += (sim.pitch / 5);
            sim.airspeed -= (sim.pitch / 18);
            if (sim.airspeed < 60) sim.airspeed = 60; // Stall boundary cap
            if (sim.airspeed > 250) sim.airspeed = 250; // VNE speed limit cap
            renderPFD();
        }, 50);

        function connectToPi() {
            const ip = document.getElementById('ipAddress').value.trim() || "10.0.0.79";
            socket = new WebSocket(`ws://${ip}:8765`);

            socket.onopen = function() { console.log("PFD Core Link Online."); };

            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    sim.pitch = data.pitch;
                    sim.roll = data.roll;
                    sim.heading = data.heading; // Assign new compass channel
                    sim.targetAlt = data.target_alt;
                    
                    mcpAlt.innerText = data.target_alt + " FT";
                } catch (err) {}
            };
        }
    </script>
</body>
</html>
