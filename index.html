<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Horizon - Advanced Flight Deck</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-cyan: #06b6d4;
            --neon-green: #10b981;
            --neon-red: #ef4444;
            --glass-bg: rgba(30, 41, 59, 0.45);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body {
            background: radial-gradient(circle at center, #1e1b4b 0%, #0f0a1e 100%);
            color: #f8fafc;
            font-family: 'Rajdhani', sans-serif;
            text-align: center;
            margin: 0;
            padding: 30px 20px;
            letter-spacing: 0.05em;
        }

        h1 { 
            font-size: 2.5rem;
            font-weight: 700;
            margin: 0;
            text-transform: uppercase;
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255,255,255,0.1);
        }

        .subtitle {
            font-size: 1rem;
            color: var(--neon-cyan);
            text-transform: uppercase;
            margin-top: 5px;
            margin-bottom: 25px;
            font-weight: 700;
            letter-spacing: 0.2em;
        }
        
        /* Glassmorphism Connection Control Panel */
        .controls {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        input {
            padding: 8px 14px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(15, 23, 42, 0.6);
            color: white;
            font-family: 'Share Tech Mono', monospace;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }
        input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.3);
        }

        button {
            padding: 8px 18px;
            border-radius: 6px;
            border: none;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
        }
        button:hover { 
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(2, 132, 199, 0.4);
        }

        .status-container {
            font-size: 14px;
            margin-bottom: 25px;
            text-transform: uppercase;
            font-weight: 700;
            color: #64748b;
        }
        .status { 
            color: var(--neon-red); 
            transition: color 0.3s ease;
        }
        
        /* Main Flight Deck Dashboard Layout Grid */
        .dashboard-grid {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 500px;
            margin: 0 auto;
            gap: 20px;
        }

        /* Glassmorphism Autopilot Mode Control Panel */
        .mcp-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            width: 100%;
            box-sizing: border-box;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        .mcp-group {
            text-align: left;
        }
        .mcp-label {
            color: #94a3b8;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 2px;
        }
        .mcp-display {
            color: var(--neon-cyan);
            font-family: 'Share Tech Mono', monospace;
            font-size: 26px;
            font-weight: bold;
            text-shadow: 0 0 12px rgba(6, 182, 212, 0.6);
        }
        .mcp-sys-title {
            font-weight: 700;
            font-size: 16px;
            color: #cbd5e1;
            text-transform: uppercase;
            border-left: 3px solid var(--neon-cyan);
            padding-left: 8px;
        }

        /* Instrument Container Styling */
        .instrument-wrapper {
            position: relative;
            padding: 10px;
            background: radial-gradient(circle at center, rgba(30,41,59,0.2) 0%, rgba(15,23,42,0.8) 100%);
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
        }

        canvas {
            background-color: #020617;
            border: 6px solid #334155;
            border-radius: 50%;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
            display: block;
        }
    </style>
</head>
<body>

    <h1>PROJECT HORIZON</h1>
    <div class="subtitle">Primary Flight Display</div>
    
    <div class="controls">
        <input type="text" id="ipAddress" placeholder="10.0.0.79">
        <button onclick="connectToPi()">Engage Link</button>
    </div>

    <div class="status-container">SYS LINK: <span id="statusText" class="status">Offline</span></div>

    <div class="dashboard-grid">
        <div class="mcp-panel">
            <div class="mcp-sys-title">Autopilot HUD</div>
            <div class="mcp-group">
                <div class="mcp-label">SEL ALT</div>
                <div id="altDisplay" class="mcp-display">5000 FT</div>
            </div>
        </div>

        <div class="instrument-wrapper">
            <canvas id="horizonCanvas" width="400" height="400"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('horizonCanvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('statusText');
        const altDisplay = document.getElementById('altDisplay');
        
        let socket = null;

        function drawInstrument(pitch, roll) {
            const width = canvas.width;
            const height = canvas.height;
            const cx = width / 2;
            const cy = height / 2;
            const radius = width / 2;

            ctx.clearRect(0, 0, width, height);

            // 1. DRAW ROTATING SKY/GROUND OVERLAY
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(roll * Math.PI / 180);

            const pitchOffset = pitch * 2.5; // Slightly enhanced dynamic range

            // Premium Deep Sky Gradient
            let skyGrad = ctx.createLinearGradient(0, -radius, 0, radius);
            skyGrad.addColorStop(0, '#0284c7');
            skyGrad.addColorStop(1, '#38bdf8');
            ctx.fillStyle = skyGrad; 
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, 2 * Math.PI);
            ctx.fill();

            // Premium Terrain Gradient
            let groundGrad = ctx.createLinearGradient(0, -radius, 0, radius);
            groundGrad.addColorStop(0, '#451a03');
            groundGrad.addColorStop(1, '#78350f');
            ctx.fillStyle = groundGrad; 
            ctx.beginPath();
            ctx.rect(-radius, pitchOffset, radius * 2, radius * 2);
            ctx.fill();

            // Horizon Dividing Line
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(-radius, pitchOffset);
            ctx.lineTo(radius, pitchOffset);
            ctx.stroke();

            // Clean Pitch Ladder Configurations
            ctx.strokeStyle = "rgba(255, 255, 255, 0.6)";
            ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
            ctx.lineWidth = 2;
            ctx.font = "700 13px 'Rajdhani', sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            function drawPitchLine(degrees, labelText) {
                let yPos = pitchOffset - (degrees * 2.5);
                ctx.beginPath();
                ctx.moveTo(-25, yPos);
                ctx.lineTo(25, yPos);
                ctx.stroke();
                ctx.fillText(labelText, -40, yPos);
                ctx.fillText(labelText, 40, yPos);
            }

            drawPitchLine(20, "20");
            drawPitchLine(10, "10");
            drawPitchLine(-10, "10");
            drawPitchLine(-20, "20");

            ctx.restore();

            // 2. FIXED AERODYNAMIC SYMBOL (Sleek minimalist style)
            ctx.strokeStyle = "#f59e0b"; 
            ctx.lineWidth = 4;
            ctx.shadowBlur = 10;
            ctx.shadowColor = "rgba(245, 158, 11, 0.5)";
            
            ctx.beginPath();
            // Left Wing Profile
            ctx.moveTo(cx - 70, cy);
            ctx.lineTo(cx - 25, cy);
            ctx.lineTo(cx - 25, cy + 8);
            // Center Reticle
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, 2, 0, 2 * Math.PI);
            // Right Wing Profile
            ctx.moveTo(cx + 70, cy);
            ctx.lineTo(cx + 25, cy);
            ctx.lineTo(cx + 25, cy + 8);
            ctx.stroke();
            
            // Clear shadow effect for subsequent drawings
            ctx.shadowBlur = 0;
        }

        // Initialize display graphic
        drawInstrument(0, 0);

        function connectToPi() {
            const ip = document.getElementById('ipAddress').value.trim() || "10.0.0.79";
            
            statusText.innerText = "Connecting...";
            statusText.style.color = "#f59e0b";

            socket = new WebSocket(`ws://${ip}:8765`);

            socket.onopen = function() {
                statusText.innerText = "Online";
                statusText.style.color = "var(--neon-green)";
                statusText.style.textShadow = "0 0 10px rgba(16, 185, 129, 0.5)";
            };

            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    drawInstrument(data.pitch, data.roll);
                    altDisplay.innerText = data.target_alt + " FT";
                } catch (err) {
                    console.error("Data tracking failure:", err);
                }
            };

            socket.onclose = function() {
                statusText.innerText = "Offline";
                statusText.style.color = "var(--neon-red)";
                statusText.style.textShadow = "none";
            };
        }
    </script>

</body>
</html>
