<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Horizon - Low-Poly Flight Sim</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 0; background-color: #000;
            font-family: 'Share Tech Mono', monospace; overflow: hidden;
            color: #00ff66;
        }
        header {
            position: absolute; top: 15px; left: 15px; z-index: 10;
            background: rgba(0,0,0,0.8); padding: 10px 20px;
            border: 1px solid #00ff66; border-radius: 6px;
            display: flex; gap: 20px; align-items: center;
        }
        input {
            background: #111; border: 1px solid #00ff66; color: #00ff66;
            padding: 5px; font-family: monospace; outline: none; width: 100px;
        }
        button {
            background: #00ff66; border: none; color: black;
            padding: 5px 12px; font-weight: bold; cursor: pointer;
        }
        .hud-overlay {
            position: absolute; bottom: 20px; left: 50%;
            transform: translateX(-50%); z-index: 10;
            background: rgba(0,0,0,0.8); padding: 15px 30px;
            border: 2px solid #00ff66; border-radius: 8px;
            display: flex; gap: 40px; font-size: 22px;
        }
        .hud-stat span { color: #fff; font-weight: bold; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>

    <header>
        <div>COCKPIT POV SIM</div>
        <input type="text" id="ipAddress" placeholder="10.0.0.79">
        <button onclick="connectToPi()">ENGAGE LINK</button>
    </header>

    <div class="hud-overlay">
        <div class="hud-stat">THR: <span id="hudThr">0%</span></div>
        <div class="hud-stat">SPD: <span id="hudSpd">0 KT</span></div>
        <div class="hud-stat">ALT: <span id="hudAlt">0 FT</span></div>
    </div>

    <canvas id="cockpitCanvas"></canvas>

    <script>
        const canvas = document.getElementById('cockpitCanvas');
        const ctx = canvas.getContext('2d');
        const hudThr = document.getElementById('hudThr');
        const hudSpd = document.getElementById('hudSpd');
        const hudAlt = document.getElementById('hudAlt');

        let socket = null;

        // Flight Telemetry
        let flight = { pitch: 0, roll: 0, heading: 0, throttle: 0, airspeed: 0, altitude: 300 };
        
        // 3D Terrain Configuration
        const gridCols = 24;       
        const gridRows = 25;       
        const spacing = 50;        
        let worldForwardZ = 0;     
        let worldLeftX = 0;        // NEW: Tracks your true lateral position over the world map

        // Heightmap generator for 3D islands/peaks
        function getTerrainElevation(gx, gz) {
            let mountainNoise = Math.sin(gx * 0.15) * Math.cos(gz * 0.12) * 160;
            let detailNoise = Math.sin(gz * 0.3) * 30;
            let finalHeight = mountainNoise + detailNoise;
            return finalHeight < 15 ? 0 : finalHeight;
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function drawCockpit() {
            const W = canvas.width;
            const H = canvas.height;
            const cx = W / 2;
            const cy = H / 2;

            // Smooth airspeed calculation
            flight.airspeed += ((flight.throttle * 2.5) - flight.airspeed) * 0.03;
            
            // Unlocked pitch physics (Climb / Dive)
            flight.altitude += (flight.pitch * 0.25) * (flight.airspeed / 60);

            // NEW: True banking steering. Turning left/right shifts your actual world position X
            // If you roll right (positive), worldLeftX increases, moving the map left
            let turnRate = Math.sin(flight.roll * Math.PI / 180) * (flight.airspeed * 0.05);
            worldLeftX += turnRate;

            // Track forward movement depth
            let speedFactor = flight.airspeed * 0.15;
            worldForwardZ += speedFactor;

            // Sky background
            ctx.fillStyle = "#4ba3e3"; 
            ctx.fillRect(0, 0, W, H);

            // -------------------------------------------------------------
            // 3D PERSPECTIVE MESH LANDSCAPE ENGINE
            // -------------------------------------------------------------
            for (let r = gridRows - 2; r >= 0; r--) {
                for (let c = 0; c < gridCols - 1; c++) {
                    
                    // Base grid coordinates centered around the viewer
                    let xIdx1 = c - (gridCols / 2);
                    let xIdx2 = (c + 1) - (gridCols / 2);
                    
                    let zRow1 = r;
                    let zRow2 = r + 1;

                    // Apply horizontal shifting to map calculations based on steering drift
                    let wX1 = (xIdx1 * spacing) - (worldLeftX % spacing);
                    let wX2 = (xIdx2 * spacing) - (worldLeftX % spacing);
                    let wZ1 = (zRow1 * spacing) - (worldForwardZ % spacing);
                    let wZ2 = (zRow2 * spacing) - (worldForwardZ % spacing);

                    // Map grid calculations back to absolute matrix points to keep features stable
                    let absX1 = xIdx1 + Math.floor(worldLeftX / spacing);
                    let absX2 = xIdx2 + Math.floor(worldLeftX / spacing);
                    let absZ1 = zRow1 + Math.floor(worldForwardZ / spacing);
                    let absZ2 = zRow2 + Math.floor(worldForwardZ / spacing);

                    // Sample elevations for the quad tile patch
                    let hTL = getTerrainElevation(absX1, absZ1);
                    let hTR = getTerrainElevation(absX2, absZ1);
                    let hBL = getTerrainElevation(absX1, absZ2);
                    let hBR = getTerrainElevation(absX2, absZ2);

                    const fov = 400;
                    
                    // Project Corner 1: Top Left
                    let s1 = fov / wZ1;
                    let pTL = { x: cx + wX1 * s1, y: cy + (flight.altitude - hTL) * s1 };

                    // Project Corner 2: Top Right
                    let pTR = { x: cx + wX2 * s1, y: cy + (flight.altitude - hTR) * s1 };

                    // Project Corner 3: Bottom Left
                    let s2 = fov / wZ2;
                    let pBL = { x: cx + wX1 * s2, y: cy + (flight.altitude - hBL) * s2 };

                    // Project Corner 4: Bottom Right
                    let pBR = { x: cx + wX2 * s2, y: cy + (flight.altitude - hBR) * s2 };

                    // Apply camera roll translation parameters matrix
                    let rad = -flight.roll * Math.PI / 180;
                    let cosR = Math.cos(rad);
                    let sinR = Math.sin(rad);
                    let pitchOffset = flight.pitch * 6;

                    function transform3D(pt) {
                        let rx = (pt.x - cx) * cosR - (pt.y - cy) * sinR;
                        let ry = (pt.x - cx) * sinR + (pt.y - cy) * cosR;
                        return { x: cx + rx, y: cy + ry + pitchOffset };
                    }

                    let tTL = transform3D(pTL);
                    let tTR = transform3D(pTR);
                    let tBL = transform3D(pBL);
                    let tBR = transform3D(pBR);

                    if (wZ1 <= 5 || wZ2 <= 5) continue;

                    let heightAvg = (hTL + hTR + hBL + hBR) / 4;
                    
                    if (heightAvg <= 0) {
                        ctx.fillStyle = (c + r) % 2 === 0 ? "#1d4ed8" : "#2563eb";
                        ctx.strokeStyle = "rgba(29, 78, 216, 0.2)";
                    } else {
                        let greenShade = Math.floor(100 + (heightAvg * 0.7));
                        greenShade = Math.max(40, Math.min(240, greenShade));
                        ctx.fillStyle = `rgb(${25}, ${greenShade}, ${45})`;
                        ctx.strokeStyle = `rgb(${15}, ${greenShade - 20}, ${35})`;
                    }

                    ctx.beginPath();
                    ctx.moveTo(tTL.x, tTL.y);
                    ctx.lineTo(tTR.x, tTR.y);
                    ctx.lineTo(tBR.x, tBR.y);
                    ctx.lineTo(tBL.x, tBL.y);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                }
            }

            // -------------------------------------------------------------
            // HUD Windshield Overlay
            // -------------------------------------------------------------
            ctx.strokeStyle = "#00ff66";
            ctx.lineWidth = 2;
            
            ctx.beginPath();
            ctx.arc(cx, cy, 12, 0, 2 * Math.PI);
            ctx.moveTo(cx - 35, cy); ctx.lineTo(cx - 12, cy);
            ctx.moveTo(cx + 35, cy); ctx.lineTo(cx + 12, cy);
            ctx.moveTo(cx, cy - 12); ctx.lineTo(cx, cy - 22);
            ctx.stroke();

            ctx.strokeStyle = "rgba(0, 255, 100, 0.4)";
            ctx.beginPath();
            ctx.moveTo(cx - 100, cy - 80); ctx.lineTo(cx - 70, cy - 80); ctx.lineTo(cx - 70, cy - 65);
            ctx.moveTo(cx + 100, cy - 80); ctx.lineTo(cx + 70, cy - 80); ctx.lineTo(cx + 70, cy - 65);
            ctx.moveTo(cx - 100, cy + 80); ctx.lineTo(cx - 70, cy + 80); ctx.lineTo(cx - 70, cy + 65);
            ctx.moveTo(cx + 100, cy + 80); ctx.lineTo(cx + 70, cy + 80); ctx.lineTo(cx + 70, cy + 65);
            ctx.stroke();

            hudThr.innerText = Math.round(flight.throttle) + "%";
            hudSpd.innerText = Math.round(flight.airspeed) + " KT";
            hudAlt.innerText = Math.round(flight.altitude) + " FT";

            requestAnimationFrame(drawCockpit);
        }

        requestAnimationFrame(drawCockpit);

        function connectToPi() {
            const ip = document.getElementById('ipAddress').value.trim() || "10.0.0.79";
            socket = new WebSocket(`ws://${ip}:8765`);
            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    flight.pitch = data.pitch;
                    flight.roll = data.roll;
                    flight.heading = data.heading;
                    flight.throttle = data.throttle;
                } catch (err) {}
            };
        }
    </script>
</body>
</html>
